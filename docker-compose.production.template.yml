services:
  bucket-backend:
    image: bhiv/bucket-backend:IMG_TAG
    container_name: bhiv_bucket_backend
    restart: unless-stopped
    ports:
      - "8012:8000"
    env_file:
      - .env
    environment:
      - FASTAPI_PORT=8000
      - MONGODB_URI=${MONGODB_URI}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - bucket_network

networks:
  bucket_network:
    driver: bridge
